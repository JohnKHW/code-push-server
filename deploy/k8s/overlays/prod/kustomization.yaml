apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namePrefix: prod-
resources:
  - ../../base
labels:
  - pairs:
      app.kubernetes.io/instance: codepush-prod
      app.kubernetes.io/part-of: codepush
      environment: prod
    includeSelectors: true
    includeTemplates: true
configMapGenerator:
  - name: codepush-config
    behavior: merge
    literals:
      - DEPLOYMENT_ENVIRONMENT=prod
patches:
  - target:
      kind: Deployment
      name: codepush-api
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/envFrom/1/secretRef/name
        value: prod-codepush-secrets
