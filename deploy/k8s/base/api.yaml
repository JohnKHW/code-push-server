apiVersion: apps/v1
kind: Deployment
metadata:
  name: codepush-api
spec:
  replicas: 1
  revisionHistoryLimit: 3
  # Keep one API pod during image updates. This entails a brief interruption.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: codepush-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: codepush-api
        app.kubernetes.io/component: api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: api
          image: codepush-api:deployment
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: codepush-config
            - secretRef:
                name: codepush-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: temporary
          emptyDir:
            sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: codepush-api
spec:
  selector:
    app.kubernetes.io/name: codepush-api
  ports:
    - name: http
      port: 3000
      targetPort: http
